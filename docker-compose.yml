services:
  postgres:
    image: postgres:16
    container_name: africa_sdmx_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-africa_sdmx}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "55432:5432"
    volumes:
      - africa_sdmx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  africa_sdmx_pgdata:
